<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vazylis</title>
    <meta name="description" content="Vazylis : Le Dernier Rempart" />
    <meta name="theme-color" content="#1a1022" />

    <!-- Ouverture en plein écran sans la barre de Safari, une fois l'app ajoutée à l'écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vazylis" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="render-canvas"></canvas>
      <div id="fps-counter">0 FPS</div>
      <div id="touch-zone"></div>
      <div id="character-select">
        <h1>Choisis ton personnage</h1>
        <div class="choices">
          <button id="select-male" type="button">Homme</button>
          <button id="select-female" type="button">Femme</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
