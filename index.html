<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Vazylis</title>
    <meta name="description" content="Vazylis : Le Dernier Rempart" />
    <meta name="theme-color" content="#1a1022" />

    <!-- Ouverture en plein écran sans la barre de Safari, une fois l'app ajoutée à l'écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vazylis" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="render-canvas"></canvas>
      <div id="fps-counter">0 FPS</div>
      <div id="touch-zone"></div>
      <div id="world-overlay"></div>
      <div id="hud">
        <div id="hud-name">Vazylien</div>
        <div id="hud-level">Niveau 1</div>
        <div class="hud-bar hp-bar">
          <div id="hud-hp-fill" class="hud-bar-fill"></div>
          <span id="hud-hp-label" class="hud-bar-label">0 / 0</span>
        </div>
        <div class="hud-bar mana-bar">
          <div id="hud-mana-fill" class="hud-bar-fill" style="width: 100%"></div>
          <span id="hud-mana-label" class="hud-bar-label">0 / 0</span>
        </div>
        <div class="hud-bar xp-bar">
          <div id="hud-xp-fill" class="hud-bar-fill"></div>
          <span id="hud-xp-label" class="hud-bar-label">0 %</span>
        </div>
      </div>
      <button id="open-stats" type="button" class="icon-button">Stats</button>
      <button id="open-inventory" type="button" class="icon-button inventory-button">Sac</button>
      <div id="mode-buttons">
        <button id="mode-combat" type="button" class="mode-button">Arme</button>
        <button id="mode-move" type="button" class="mode-button active">Pied</button>
      </div>
      <div id="stats-panel" class="hidden">
        <div class="stats-panel-box">
          <h2>Statistiques</h2>
          <div id="stats-points">Points disponibles : 0</div>
          <div class="stats-row">
            <span class="stats-label">Force</span>
            <button type="button" class="stats-btn" data-stat="force" data-delta="-1">−</button>
            <span id="stats-value-force" class="stats-value">0</span>
            <button type="button" class="stats-btn" data-stat="force" data-delta="1">+</button>
          </div>
          <div class="stats-row">
            <span class="stats-label">Agilité</span>
            <button type="button" class="stats-btn" data-stat="agilite" data-delta="-1">−</button>
            <span id="stats-value-agilite" class="stats-value">0</span>
            <button type="button" class="stats-btn" data-stat="agilite" data-delta="1">+</button>
          </div>
          <div class="stats-row">
            <span class="stats-label">Vitalité</span>
            <button type="button" class="stats-btn" data-stat="vitalite" data-delta="-1">−</button>
            <span id="stats-value-vitalite" class="stats-value">0</span>
            <button type="button" class="stats-btn" data-stat="vitalite" data-delta="1">+</button>
          </div>
          <div class="stats-row">
            <span class="stats-label">Intelligence</span>
            <button type="button" class="stats-btn" data-stat="intelligence" data-delta="-1">−</button>
            <span id="stats-value-intelligence" class="stats-value">0</span>
            <button type="button" class="stats-btn" data-stat="intelligence" data-delta="1">+</button>
          </div>
          <div class="stats-actions">
            <button id="stats-close" type="button" class="stats-action-btn">Fermer</button>
            <button id="stats-validate" type="button" class="stats-action-btn primary">Valider</button>
          </div>
          <p class="stats-warning">Une fois validés, les points sont définitifs.</p>
        </div>
      </div>
      <div id="inventory-panel" class="hidden">
        <div class="stats-panel-box inventory-box">
          <h2>Sac à dos</h2>
          <div id="inventory-equipped"></div>
          <div id="inventory-grid" class="inventory-grid"></div>
          <div id="item-detail" class="item-detail hidden">
            <div id="item-detail-name" class="item-detail-name"></div>
            <div id="item-detail-stats" class="item-detail-stats"></div>
            <div class="stats-actions">
              <button id="item-detail-secondary" type="button" class="stats-action-btn"></button>
              <button id="item-detail-primary" type="button" class="stats-action-btn primary"></button>
            </div>
          </div>
          <button id="inventory-close" type="button" class="stats-action-btn inventory-close-btn">Fermer</button>
        </div>
      </div>
      <div id="character-select">
        <h1>Choisis ton personnage</h1>
        <div class="choices">
          <button id="select-male" type="button">Homme</button>
          <button id="select-female" type="button">Femme</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
